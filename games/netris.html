<style>
  .screen { position:relative; }
  .screen iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; mix-blend-mode:multiply; }
  /* Same LCD look as our own games: grayscale the page, then multiply it onto the green screen. Dark pages are inverted first. */
  .screen iframe.lcd-light  { filter: grayscale(1) contrast(1.35); }
  .screen iframe.lcd-invert { filter: grayscale(1) contrast(1.35) invert(1); }
  /* Games whose colors matter keep their own look. */
  .screen iframe.lcd-none   { mix-blend-mode:normal; background:#fff; }
</style>
