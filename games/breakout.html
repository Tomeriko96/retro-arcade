<body>
<script src="nozoom.js"></script>
<script src="common.js"></script>
<script>
const W = 360, H = 540, ID = 'breakout';
const { ctx } = Arcade.mount({ title: 'Breakout', W, H, labels: { up: null, down: null, a: 'Launch', b: null } });
const held = Arcade.held;
const INK = Arcade.ink, MID = Arcade.mid, LABEL = Arcade.label, LCD = Arcade.lcd;

const COLS = 8, ROWS = 6, BW = W / COLS, BH = 20, TOP = 50;
const COLORS = [INK, MID, INK, MID, INK, MID];
let paddle, ball, bricks, score, lives, state; // ready | play | paused | over | won

function reset() {
  paddle = { x: W / 2, w: 64, h: 10, y: H - 40 };
  bricks = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) bricks.push({ c, r, alive: true });
  score = 0; lives = 3; serve();
}
function serve() { ball = { x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, r: 6 }; state = 'ready'; }
function action() {
  if (state === 'ready') {
    const a = Math.random() * 0.6 - 0.3;
    ball.vx = 220 * Math.sin(a); ball.vy = -260; state = 'play';
  } else if (state === 'over' || state === 'won') reset();
}
Arcade.on('a', action);
Arcade.on('start', () => {
  if (state === 'play') state = 'paused';
  else if (state === 'paused') state = 'play';
  else action();
});

function update(dt) {
  const dir = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (state === 'ready' || state === 'play') {
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x + dir * 320 * dt));
  }
  if (state === 'ready') { ball.x = paddle.x; ball.y = paddle.y - 10; return; }
  if (state !== 'play') return;
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
  // Paddle: bounce angle depends on where the ball lands.
  if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
      Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
    const t = (ball.x - paddle.x) / (paddle.w / 2);
    const sp = Math.min(520, Math.hypot(ball.vx, ball.vy) * 1.02);
    ball.vx = sp * Math.sin(t); ball.vy = -sp * Math.cos(t);
    ball.y = paddle.y - ball.r;
  }
  for (const b of bricks) {
    if (!b.alive) continue;
    const bx = b.c * BW, by = TOP + b.r * BH;
    if (ball.x + ball.r > bx && ball.x - ball.r < bx + BW && ball.y + ball.r > by && ball.y - ball.r < by + BH) {
      b.alive = false; score += (ROWS - b.r) * 10;
      const ox = Math.min(ball.x + ball.r - bx, bx + BW - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - by, by + BH - (ball.y - ball.r));
      if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      break;
    }
  }
  if (ball.y > H + 20) { lives--; if (lives <= 0) { state = 'over'; Arcade.saveHi(ID, score); } else serve(); }
  if (bricks.every((b) => !b.alive)) { state = 'won'; Arcade.saveHi(ID, score); }
}

function text(t, x, y, size, color, align) {
  ctx.fillStyle = color; ctx.font = `bold ${size}px ui-monospace, monospace`; ctx.textAlign = align || 'center';
  ctx.fillText(t, x, y);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) if (b.alive) {
    ctx.fillStyle = COLORS[b.r]; ctx.fillRect(b.c * BW + 1, TOP + b.r * BH + 1, BW - 2, BH - 2);
  }
  ctx.fillStyle = INK; ctx.fillRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h);
  ctx.fillStyle = INK; ctx.fillRect(ball.x - ball.r, ball.y - ball.r, ball.r * 2, ball.r * 2);
  text('SCORE ' + score, 10, 30, 16, INK, 'left');
  text('HI ' + Math.max(Arcade.hi(ID), score), W / 2, 30, 16, LABEL);
  text('♥'.repeat(lives), W - 10, 30, 16, INK, 'right');
  if (state === 'ready') text('Press A to launch', W / 2, H / 2 + 60, 18, INK);
  if (state === 'paused') text('PAUSED', W / 2, H / 2, 28, INK);
  if (state === 'over') { text('GAME OVER', W / 2, H / 2, 28, INK); text('Press A to play again', W / 2, H / 2 + 30, 16, INK); }
  if (state === 'won') { text('YOU WIN!', W / 2, H / 2, 28, INK); text('Press A to play again', W / 2, H / 2 + 30, 16, INK); }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
