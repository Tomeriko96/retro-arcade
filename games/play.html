<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retro Arcade</title>
<meta name="description" content="Classic mini-games. Installable, offline, no account.">
<meta name="theme-color" content="#f2cb1c">
<meta name="application-name" content="Retro Arcade">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Retro Arcade">
<meta property="og:title" content="Retro Arcade">
<meta property="og:description" content="Classic mini-games. Installable, offline, no account.">
<meta property="og:image" content="https://tomeriko96.github.io/retro-arcade/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Retro Arcade">
<meta name="twitter:description" content="Classic mini-games. Installable, offline, no account.">
<meta name="twitter:image" content="https://tomeriko96.github.io/retro-arcade/icons/icon-512.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="stylesheet" href="console.css">
<style>
  .screen { position:relative; }
  .screen iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; mix-blend-mode:multiply; }
  /* Same LCD look as our own games: grayscale the page, then multiply it onto the green screen. Dark pages are inverted first. */
  .screen iframe.lcd-light  { filter: grayscale(1) contrast(1.35); }
  .screen iframe.lcd-invert { filter: grayscale(1) contrast(1.35) invert(1); }
  /* Games whose colors matter keep their own look. */
  .screen iframe.lcd-none   { mix-blend-mode:normal; background:#fff; }
</style>
</head>
<body>
<script src="nozoom.js"></script>
<script src="common.js"></script>
<script>
// Hosts a vendored GPL/MIT game in an iframe inside the console and turns console buttons into key events.
const K = {
  left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  kc: 37 },
  up:    { key: 'ArrowUp',    code: 'ArrowUp',    kc: 38 },
  right: { key: 'ArrowRight', code: 'ArrowRight', kc: 39 },
  down:  { key: 'ArrowDown',  code: 'ArrowDown',  kc: 40 },
  enter: { key: 'Enter',      code: 'Enter',      kc: 13 },
  space: { key: ' ',          code: 'Space',      kc: 32 },
  esc:   { key: 'Escape',     code: 'Escape',     kc: 27 },
  ctrl:  { key: 'Control',    code: 'ControlLeft', kc: 17 },
  p:     { key: 'p',          code: 'KeyP',       kc: 80 },
  s:     { key: 's',          code: 'KeyS',       kc: 83 },
  one:   { key: '1',          code: 'Digit1',     kc: 49 },
};
const dirs = { left: K.left, right: K.right, up: K.up, down: K.down };
const GAMES = {
  netris:   { title: 'Netris',            lcd: 'invert', src: 'vendor/netris/index.html',             ar: '3 / 5', vw: 480, labels: { up: 'Rotation', a: 'Rotate', b: 'Drop' }, keys: { ...dirs, a: K.up, b: K.p, start: K.s } },
  hextris:  { title: 'Hextris',           lcd: 'none', src: 'vendor/hextris/index.html',            ar: '3 / 4', vw: 480, labels: { up: null, left: 'Rotate', right: 'Rotate', a: 'Start', b: 'Pause' }, keys: { ...dirs, a: K.enter, b: K.space, start: K.enter } },
  asteroids:{ title: 'Asteroids Infinity',lcd: 'invert', src: 'vendor/asteroids-infinity/index.html', ar: '4 / 5', vw: 520, labels: { up: 'Thrust', down: 'Brake', a: 'Fire', b: 'Shield' }, keys: { ...dirs, a: K.space, b: K.ctrl, start: K.enter } },
  yanoid:   { title: 'Yanoid',            lcd: 'none', src: 'vendor/yanoid/index.html',             ar: '3 / 4', vw: 520, labels: { up: null, down: null, a: 'Fire', b: 'Pause' }, keys: { left: K.left, right: K.right, a: K.space, b: K.esc, start: { click: '#startBtn' } } },
  invaders: { title: 'Space Invaders',    lcd: 'invert', src: 'vendor/html5-space-invaders/index.html', ar: '4 / 5', vw: 640, labels: { up: null, down: null, a: 'Fire', b: 'Enter' }, keys: { left: K.left, right: K.right, a: K.space, b: K.enter, start: K.one } },
  snake:    { title: 'Snake',             lcd: 'light', src: 'vendor/html5-snake/index.html',        ar: '5 / 2', vw: 720, labels: { a: 'Start', b: null }, keys: { ...dirs, a: K.enter, b: K.enter, start: K.enter } },
};
const id = new URLSearchParams(location.search).get('g');
const g = GAMES[id];
if (!g) { location.replace('../'); }
else {
  const [w, h] = g.ar.split('/').map(Number);
  const { cv, wake } = Arcade.mount({ title: g.title, W: w * 100, H: h * 100, labels: g.labels });
  const frame = document.createElement('iframe');
  frame.src = g.src; frame.title = g.title; frame.className = 'lcd-' + g.lcd;
  frame.style.width = g.vw + 'px'; frame.style.height = (g.vw * h / w) + 'px';
  cv.replaceWith(frame);
  frame.style.touchAction = 'manipulation';
  frame.addEventListener('load', () => { window.noZoom(frame.contentWindow, false); window.focus(); try {
      frame.contentWindow.addEventListener('mousemove', wake);
      // Clicking inside the game would leave keyboard focus in the iframe and silently kill Esc/R/P and the
      // console key mapping. Hand focus back to the console after every click; the console forwards keys itself.
      frame.contentWindow.addEventListener('pointerup', () => setTimeout(() => { frame.blur(); window.focus(); }, 0));
    } catch (e) {} }); // keep the keyboard on the console so every key mapping works
  const box = frame.parentElement;
  const fit = () => {
    const s = box.clientWidth / g.vw; // game is laid out g.vw wide, then scaled; height follows the screen so no strip is left over
    frame.style.transform = 'scale(' + s + ')';
    frame.style.height = (box.clientHeight / s) + 'px';
  };
  new ResizeObserver(fit).observe(box); fit();

  function send(type, spec) {
    const win = frame.contentWindow;
    if (!win || !win.document || !win.document.body) return;
    const ev = new win.KeyboardEvent(type, { key: spec.key, code: spec.code, keyCode: spec.kc, which: spec.kc, bubbles: true, cancelable: true });
    // Some browsers ignore keyCode/which in the init dict; older games read them.
    Object.defineProperty(ev, 'keyCode', { get: () => spec.kc });
    Object.defineProperty(ev, 'which', { get: () => spec.kc });
    win.document.body.dispatchEvent(ev);
  }
  const live = new Map(); // button -> spec currently held down in the game
  Arcade.watch((name, down) => {
    const spec = g.keys[name];
    if (!spec) return;
    if (spec.click) { // some games start from an on-page button
      const el = frame.contentWindow.document.querySelector(spec.click);
      if (down && el) el.click();
      return;
    }
    if (down) { live.set(name, spec); send('keydown', spec); }
    else if (live.has(name)) { live.delete(name); send('keyup', spec); }
  });
}
</script>
</body>
</html>
