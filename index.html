<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Retro Arcade</title>
  <meta name="theme-color" content="#f2cb1c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Retro Arcade</h1>
  <p class="sub">Classic mini-games. Installable, offline, no account.</p>
  <div class="grid" id="grid"></div>
  <footer>High scores are stored on this device only.<br>GPL-3.0 &middot; <a href="https://github.com/Tomeriko96/retro-arcade/blob/main/THIRD_PARTY.md">game credits</a></footer>
</main>
<script src="games/nozoom.js"></script>
<script>
const GAMES = [
  { id: 'breakout', title: 'Breakout', desc: 'Bounce the ball, break the bricks.', href: 'games/breakout.html' },
  { id: 'blocks',   title: 'Blocks', desc: 'Stack falling blocks and clear lines.', href: 'games/blocks.html' },
  { id: 'rocks',    title: 'Space Rocks', desc: 'Blast drifting asteroids before they hit you.', href: 'games/rocks.html' },
  { id: 'shooter',  title: 'Side Shooter', desc: 'Shoot down enemies in a side-scrolling level.', href: 'games/shooter.html' },
  { title: 'Netris',            desc: 'Falling blocks. Port of Netris 0.52.', href: 'games/play.html?g=netris' },
  { title: 'Hextris',           desc: 'Match blocks around a spinning hexagon.', href: 'games/play.html?g=hextris' },
  { title: 'Asteroids Infinity', desc: 'Fly, shoot and survive the asteroid field.', href: 'games/play.html?g=asteroids' },
  { title: 'Yanoid',            desc: 'Arkanoid-style brick breaker with power-ups.', href: 'games/play.html?g=yanoid' },
  { title: 'Space Invaders',    desc: 'Defend Earth from the descending invaders.', href: 'games/play.html?g=invaders' },
  { title: 'Snake',             desc: 'Eat, grow, do not hit yourself.', href: 'games/play.html?g=snake' },
];
const grid = document.getElementById('grid');
for (const g of GAMES) {
  let hi = 0;
  if (g.id) { try { hi = Number(localStorage.getItem('arcade:hi:' + g.id)) || 0; } catch (e) {} }
  const a = document.createElement('a');
  a.className = 'card'; a.href = g.href;
  a.innerHTML = `<h2></h2><p></p><span class="hi"></span>`;
  a.querySelector('h2').textContent = g.title;
  a.querySelector('p').textContent = g.desc;
  if (g.id) a.querySelector('.hi').textContent = 'High score: ' + hi;
  grid.appendChild(a);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
